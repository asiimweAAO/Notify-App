<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notify & Motivate - UCU Login</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Main Login Card -->
                <div class="card login-card p-4 p-md-5 bg-white">
                    
                    <!-- Logo and Header -->
                    <div class="text-center mb-4">
                        <img src="logo.png" alt="Notify Logo" class="brand-logo mb-2">
                        <h3 class="fw-bold text-dark">Notify & Motivate</h3>
                        <p class="text-muted small">Uganda Christian University (UCU) Moodle Sync</p>
                    </div>

                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <!-- Keep the rest of your existing form fields here -->
                            <label for="studentEmail" class="form-label fw-semibold text-secondary">Student Email or ID</label>
                            <input type="email" class="form-control" id="studentEmail" placeholder="e.g. b39929@ucu.ac.ug" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small text-decoration-none text-primary fw-semibold">Forgot Password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">Login to App</button>
                    </form>

                    <!-- Footer Info matching Project Team Context -->
                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Stay Notified • Stay Motivated</p>
                        <span class="badge bg-light text-dark mt-2 border">UCU Group 16 Project</span>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        window.location.href = "dashboard.html";
    });
</script>

</body>
</html>
