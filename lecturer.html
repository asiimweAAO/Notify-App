<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTIFY | Lecturer Portal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/portal.css">
</head>

<body>

  <div id="site-nav"></div>

  <main>
    <section class="py-5">
      <div class="container" style="max-width: 720px;">

        <h1 class="h3 fw-bold mb-1">Lecturer Portal</h1>
        <p class="small text-white-50 mb-4">
          Publish an assignment or announcement to the simulated Moodle database.
          Students will see it after they press “Sync with Moodle”.
        </p>

        <!-- Success / error message -->
        <div id="status" class="alert d-none" role="status"></div>

        <!-- Publish form -->
        <div class="card shadow-sm mb-4">
          <div class="card-body p-4">
            <form id="publishForm" novalidate>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="course" class="form-label fw-semibold">Course name</label>
                  <input type="text" id="course" class="form-control" placeholder="e.g. Structured Programming" required>
                </div>

                <div class="col-md-6">
                  <label for="type" class="form-label fw-semibold">Type</label>
                  <select id="type" class="form-select">
                    <option value="assignment">Assignment</option>
                    <option value="announcement">Announcement</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="title" class="form-label fw-semibold">Assignment title</label>
                  <input type="text" id="title" class="form-control" placeholder="e.g. Python loops worksheet" required>
                </div>

                <div class="col-md-6">
                  <label for="deadline" class="form-label fw-semibold">Deadline</label>
                  <input type="datetime-local" id="deadline" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label for="priority" class="form-label fw-semibold">Priority</label>
                  <select id="priority" class="form-select">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="url" class="form-label fw-semibold">Moodle target URL</label>
                  <input type="url" id="url" class="form-control" placeholder="https://moodle.ucu.ac.ug/mod/assign/view.php?id=123" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary fw-semibold mt-4">Publish to Moodle</button>
            </form>
          </div>
        </div>

        <!-- Everything published so far -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 class="h5 mb-0">Published items (<span id="count">0</span>)</h2>
          <button id="clearBtn" class="btn btn-outline-danger btn-sm" type="button">Clear all (demo reset)</button>
        </div>
        <div id="postList"></div>

      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/common.js"></script>
  <script src="js/lecturer.js"></script>
</body>
</html>
