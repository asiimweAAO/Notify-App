<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOTIFY | Student Login</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%94%94%3C/text%3E%3C/svg%3E">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/design.css">
  <link rel="stylesheet" href="css/portal.css">
</head>

<body>

  <div id="site-nav"></div>

  <main>
    <section class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-7 col-lg-5">

            <div class="card shadow-lg border-0 rounded-4">
              <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                  <h1 class="h3 fw-bold">Student Login</h1>
                  <p class="small mb-0">Uganda Christian University (UCU) Moodle Sync</p>
                </div>

                <!-- Shown by login.js when the details are wrong -->
                <div id="loginError" class="alert alert-danger d-none" role="alert">
                  Invalid email or password. Please try again.
                </div>

                <form id="loginForm" novalidate>
                  <div class="mb-3">
                    <label for="studentEmail" class="form-label fw-semibold">Student email</label>
                    <input type="email" class="form-control" id="studentEmail"
                           placeholder="e.g. b36700@students.ucu.ac.ug"
                           autocomplete="username" required>
                  </div>

                  <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                  </div>

                  <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login to App</button>
                </form>

                <p class="text-center small mt-4 mb-0">Stay Notified • Stay Motivated</p>

              </div>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
